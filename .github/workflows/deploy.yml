name: Deploy

# 触发方式：
#   1. 手动：Actions → Deploy → Run workflow
#   2. 打 tag：git tag v1.0.0 && git push origin v1.0.0
#
# 目标机: 天翼云 14.29.216.219 · /data/gfcc（git 树，origin=github GenzLTD/gfcc）
# gfcc-kernel 由 systemd（gfcc-kernel.service）托管 uvicorn :5211，
# 非 docker compose —— 部署 = git checkout <SHA> + systemctl restart gfcc-kernel。
#
# GitHub Secrets（必填）:
#   DEPLOY_HOST     - 14.29.216.219
#   DEPLOY_USER     - root
#   DEPLOY_SSH_KEY  - root SSH 私钥全文（天翼可直接访问 github GenzLTD/gfcc）
#   DEPLOY_PORT     - 22（可选）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to /data/gfcc and restart gfcc-kernel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /data/gfcc
            export GIT_SHA="${{ github.sha }}"
            git fetch origin main
            git checkout --force "${GIT_SHA}"
            echo "=== checked out $(git rev-parse HEAD) ==="
            systemctl restart gfcc-kernel
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:5211/health >/dev/null 2>&1; then
                echo "gfcc-kernel healthy after ${i}s"
                break
              fi
              sleep 2
            done
            curl -sf http://127.0.0.1:5211/health || { journalctl -u gfcc-kernel -n 40 --no-pager; exit 1; }
            echo "=== deploy OK ==="
