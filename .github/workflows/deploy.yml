name: Deploy

# 天翼已退役。本工作流不再登录旧机，也不再重启旧机上的 gfcc-kernel。
# 打 tag（v*）或手动运行时，通知 thomas-core 的 deploy-106：
# 把这个提交的契约钉进核，再部署到新机。
# 新机地址只存在于 thomas-core 的 vars.DEPLOY106_HOST，本仓不写主机名或 IP。
#
# Secret（本仓）:
#   THOMAS_DISPATCH_TOKEN  对 GenzLTD/thomas-core 具备 Contents: write 的令牌

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  notify-thomas-core:
    runs-on: ubuntu-latest
    steps:
      - name: 通知 deploy-106 同步本提交
        env:
          TOKEN: ${{ secrets.THOMAS_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "THOMAS_DISPATCH_TOKEN 未配置，拒绝把部署指回旧机"
            exit 1
          fi
          payload=$(python3 -c 'import json,os; print(json.dumps({"event_type":"gfcc-tag","client_payload":{"sha":os.environ["SHA"],"ref":os.environ["REF"]}}))')
          curl -sfS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/GenzLTD/thomas-core/dispatches \
            -d "$payload"
          echo "dispatched gfcc-tag sha=$SHA"
