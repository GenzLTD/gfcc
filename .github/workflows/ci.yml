name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- 共享内核单元测试（ethos / tenet 零外部依赖，快速反馈） ----
  test-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared cores
        run: pip install -e services/ethos -e services/tenet
      - name: Run tests
        run: pytest -q services/ethos/tests services/tenet/tests
      - name: Import sanity (tatha / gateway)
        run: |
          pip install -q fastapi uvicorn httpx pydantic python-multipart
          python -c "import sys; sys.path.insert(0, 'services/tatha/src'); import tatha.api.app; print('tatha OK')"
          python -c "import sys; sys.path.insert(0, 'services/agentmemory'); import gateway; print('gateway OK')"

  # ---- 镜像构建 + 推送 GHCR（仅 main 分支） ----
  build-images:
    runs-on: ubuntu-latest
    needs: test-libs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          set -e
          for img in tatha demopeter; do
            docker build -f services/${img}/Dockerfile -t ghcr.io/${{ github.repository }}/${img}:latest .
            docker push ghcr.io/${{ github.repository }}/${img}:latest
          done
          docker build -f services/agentmemory/Dockerfile.gateway -t ghcr.io/${{ github.repository }}/am-gateway:latest .
          docker push ghcr.io/${{ github.repository }}/am-gateway:latest
          docker build -f services/agentmemory/Dockerfile.bridge -t ghcr.io/${{ github.repository }}/am-bridge:latest .
          docker push ghcr.io/${{ github.repository }}/am-bridge:latest
