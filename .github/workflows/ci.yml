name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- 共享内核单元测试（ethos / tenet 零外部依赖，快速反馈） ----
  test-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared cores
        run: pip install -e services/ethos -e services/tenet pytest
      - name: Run tests
        run: pytest -q services/ethos/tests services/tenet/tests
      - name: Import sanity (tatha / gateway)
        run: |
          pip install -q fastapi uvicorn httpx pydantic python-multipart
          python -c "import sys; sys.path.insert(0, 'services/tatha/src'); import tatha.api.app; print('tatha OK')"
          python -c "import sys; sys.path.insert(0, 'services/agentmemory'); import gateway; print('gateway OK')"

  # ---- 格契内核单元测试（信封严格性 / 端口解析 / store 槽红线 / consensus 状态机） ----
  test-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 注意：kernel 的 ethos 依赖是本地路径包（../ethos），必须与 ethos 一起 editable 安装
      - name: Install kernel (+ local ethos dependency)
        run: pip install -e services/ethos -e services/gfcc_kernel pytest httpx
      - name: Run kernel tests
        run: pytest -q services/gfcc_kernel/tests

  # ---- 契约校验（JSON 合法 + version 一致 + $ref 可解析，防 G1 冻结后字段漂移） ----
  test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contracts
        run: python tools/validate_contracts.py


  # ---- 镜像构建 + 推送 GHCR（仅 main 分支） ----
  build-images:
    runs-on: ubuntu-latest
    needs: [test-libs, test-kernel, test-contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image repo
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push images
        run: |
          set -e
          # GHCR 仓库名必须全小写；GITHUB_REPOSITORY 保留 owner 原始大小写（GenzLTD），必须先转小写
          for img in tatha demopeter; do
            docker build -f services/${img}/Dockerfile -t ${IMAGE_REPO}/${img}:latest .
            docker push ${IMAGE_REPO}/${img}:latest
          done
          docker build -f services/agentmemory/Dockerfile.gateway -t ${IMAGE_REPO}/am-gateway:latest .
          docker push ${IMAGE_REPO}/am-gateway:latest
          docker build -f services/agentmemory/Dockerfile.bridge -t ${IMAGE_REPO}/am-bridge:latest .
          docker push ${IMAGE_REPO}/am-bridge:latest
