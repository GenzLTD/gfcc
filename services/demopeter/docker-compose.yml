# ============================================================
# szpeter2026 知识库 — Docker Compose 编排
# ============================================================
# 本地开发:  docker compose up -d              → chroma + pgvector + web (5220)
# 生产部署:  docker compose --profile production up -d → 含 nginx (80)
# 停止:     docker compose down
# 更新:     docker compose up -d --build
# 日志:     docker compose logs -f web
# ============================================================

services:

  # ============================================
  # Nginx 反向代理（仅生产模式启用）
  # 本地开发: 不启动，直接访问 web:5220
  # 生产部署: docker compose --profile production up -d
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: szpeter2026-nginx
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      # - "443:443"  # 配置 SSL 证书后取消注释
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    networks:
      - szpeter2026-net

  # ============================================
  # Flask Web 面板（Gunicorn 生产模式）
  # ============================================
  web:
    build: .
    image: szpeter2026-web:latest
    container_name: szpeter2026-web
    restart: unless-stopped
    # Flask 在容器内监听 5220
    ports:
      - "5220:5220"
    volumes:
      # 数据持久化（复用仓库根目录现有数据，跨平台兼容）
      - ./db:/app/db
      - ./knowledge_base:/app/knowledge_base
      # 预处理语料（JSONL 批量入库）
      - ./data/import_staging:/app/import_staging
    env_file:
      - .env.production
    depends_on:
      chroma:
        condition: service_started
    networks:
      - szpeter2026-net

  # ============================================
  # Chroma 向量数据库（主）
  # ============================================
  chroma:
    image: chromadb/chroma:latest
    container_name: szpeter2026-chroma
    restart: unless-stopped
    # 端口统一规划：8000 归 knowledge-api，Chroma 宿主机侧用 8001（容器内仍 8000）
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - szpeter2026-net

  # ============================================
  # pgvector（可选，不需要可注释掉整个块）
  # ============================================
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: szpeter2026-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - pgvector_init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-szpeter}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DATABASE:-szpeter2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-szpeter} -d ${PGVECTOR_DATABASE:-szpeter2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - szpeter2026-net

networks:
  szpeter2026-net:
    driver: bridge

volumes:
  chroma_data:
  pgvector_data:
  pgvector_init:
