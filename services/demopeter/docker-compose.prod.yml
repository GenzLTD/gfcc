# ============================================================
# szpeter2026 知识库 — Docker Compose 编排（阿里云生产版）
# ============================================================
# 用法（在阿里云 ECS 上执行）：
#   cd /opt/szpeter2026
#   docker compose --profile production up -d --build
#
# 本地开发（不推荐，用 docker-compose.dev.yml）：
#   docker compose up -d
#
# 停止:     docker compose --profile production down
# 更新:     docker compose --profile production up -d --build
# 日志:     docker compose logs -f web
# ============================================================

services:

  # ============================================
  # Nginx 反向代理（生产模式启用）
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: szpeter2026-nginx
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      # - "443:443"  # 配置 SSL 证书后取消注释
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - szpeter2026-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Flask Web 面板（Gunicorn 生产模式）
  # ============================================
  web:
    build: .
    image: szpeter2026-web:latest
    container_name: szpeter2026-web
    restart: unless-stopped
    # 安全加固
    security_opt:
      - no-new-privileges: true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5220/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 生产模式不直接暴露端口，通过 Nginx 代理
    expose:
      - "5220"
    volumes:
      # 数据持久化 — Linux 路径
      - ./db:/app/db
      - ./knowledge_base:/app/knowledge_base
      # 预处理语料（批量入库，只读）
      - ./import_staging:/app/import_staging:ro
    env_file:
      - .env.production
    environment:
      - WEB_DEBUG=false
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      chroma:
        condition: service_started
      pgvector:
        condition: service_healthy
    networks:
      - szpeter2026-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # Chroma 向量数据库
  # ============================================
  chroma:
    image: chromadb/chroma:latest
    container_name: szpeter2026-chroma
    restart: unless-stopped
    security_opt:
      - no-new-privileges: true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # 仅内部网络通信，不暴露到主机
    expose:
      - "8000"
    volumes:
      - ./db/chroma_docker:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/chroma/chroma
    networks:
      - szpeter2026-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # pgvector（可选，不需要可注释掉整个块）
  # ============================================
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: szpeter2026-pgvector
    restart: unless-stopped
    security_opt:
      - no-new-privileges: true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    # 仅内部网络通信
    expose:
      - "5432"
    volumes:
      - ./db/pgdata:/var/lib/postgresql/data
      - ./db/pg-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-szpeter}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DATABASE:-szpeter2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-szpeter} -d ${PGVECTOR_DATABASE:-szpeter2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - szpeter2026-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  szpeter2026-net:
    driver: bridge
